<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0E0E10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Elio">
<link id="manifest" rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="logo.svg">
<title>Elio</title>
<style>
  :root {
    --bg: #0E0E10; --panel: rgba(26, 26, 29, .78); --line: rgba(255, 211, 96, .16);
    --text: #FBF8F1; --dim: #9E9A8E; --accent: #FFD360; --warn: #FF9F43; --danger: #FF6B61; --ok: #4ade80;
    --tint: var(--accent);
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; overflow: hidden; }
  body::before { content: ""; position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(120% 60% at 50% 0%, rgba(255,211,96,.10), transparent 60%),
                linear-gradient(var(--line) 1px, transparent 1px) 0 0/28px 28px,
                linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0/28px 28px; opacity: .35; }
  #app { position: relative; height: 100%; display: flex; flex-direction: column;
    padding: calc(env(safe-area-inset-top) + 4px) 16px calc(env(safe-area-inset-bottom) + 6px); }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 0 4px; }
  header img { height: 22px; }
  .brand { font: 700 13px var(--mono); letter-spacing: .38em; }
  .sub { font: 10px var(--mono); color: var(--dim); letter-spacing: .1em; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--danger); box-shadow: 0 0 8px currentColor; }
  .dot.on { background: var(--ok); }
  header .spacer { flex: 1; }
  .icon-btn { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: rgba(255,255,255,.03);
    color: var(--accent); display: grid; place-items: center; font-size: 15px; }
  .icon-btn.hot { background: var(--accent); color: #000; border-color: transparent; }
  #orbWrap { position: relative; height: 30vh; min-height: 180px; display: grid; place-items: center; }
  #orb { width: 100%; height: 100%; }
  #state { position: absolute; bottom: 2px; font: 600 10.5px var(--mono); letter-spacing: .32em; color: var(--tint); text-transform: uppercase; }
  #partial { min-height: 22px; text-align: center; color: var(--dim); font-size: 14px; padding: 0 8px; }
  #feed { flex: 1; overflow-y: auto; padding: 8px 2px 12px; display: flex; flex-direction: column; gap: 12px;
    mask-image: linear-gradient(transparent, #000 24px); -webkit-mask-image: linear-gradient(transparent, #000 24px); }
  .msg .who { font: 600 10px var(--mono); letter-spacing: .18em; color: var(--dim); margin-bottom: 2px; }
  .msg.elio .who { color: var(--accent); }
  .msg.event .who { color: var(--warn); }
  .msg .text { white-space: pre-wrap; }
  .msg.user { align-self: flex-end; max-width: 85%; text-align: right; }
  .msg.user .text { color: var(--dim); }
  .meta { font: 10px var(--mono); color: var(--dim); opacity: .7; margin-left: 6px; letter-spacing: 0; }
  .card { border: 1px solid var(--line); background: var(--panel); border-radius: 16px; padding: 12px;
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
  .confirm { border-color: rgba(255, 211, 96, .45); }
  .confirm.danger { border-color: rgba(255, 107, 97, .6); background: rgba(255, 107, 97, .08); }
  .confirm .label { font: 600 10px var(--mono); letter-spacing: .2em; color: var(--accent); }
  .confirm.danger .label { color: var(--danger); }
  .confirm pre { white-space: pre-wrap; word-break: break-word; font: 12px var(--mono); background: rgba(0,0,0,.35);
    border-radius: 8px; padding: 8px; margin: 8px 0; max-height: 140px; overflow: auto; }
  .row { display: flex; gap: 10px; justify-content: space-between; }
  button.act { flex: 1; padding: 11px; border-radius: 12px; border: 1px solid var(--line); background: transparent;
    color: var(--dim); font: 600 14px -apple-system, system-ui; }
  button.act.go { background: var(--accent); color: #000; border: 0; }
  .confirm.danger button.act.go { background: var(--danger); color: #fff; }
  #tasks { display: flex; flex-direction: column; gap: 6px; }
  .task { display: flex; gap: 8px; align-items: center; font-size: 13px; }
  .task .s { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 6px var(--accent); flex: none; }
  .task .s.done { background: var(--ok); box-shadow: none; } .task .s.failed { background: var(--danger); box-shadow: none; }
  .task .s.waitingConfirmation { background: var(--warn); }
  .task .step { color: var(--dim); font: 11px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #dock { display: flex; flex-direction: column; align-items: center; gap: 10px; padding-top: 6px; }
  #mic { width: 76px; height: 76px; border-radius: 50%; border: 0; background: var(--accent); color: #000; font-size: 28px;
    box-shadow: 0 0 0 0 rgba(255,211,96,.5), 0 8px 30px rgba(255,211,96,.35); touch-action: none; user-select: none;
    -webkit-user-select: none; transition: transform .15s, background .2s; }
  #mic.rec { background: var(--danger); color: #fff; transform: scale(1.08); animation: pulse 1.2s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,107,97,.55); } 100% { box-shadow: 0 0 0 22px rgba(255,107,97,0); } }
  #hint { font: 11px var(--mono); color: var(--dim); letter-spacing: .08em; }
  form { display: flex; gap: 8px; align-items: center; width: 100%; }
  #input { flex: 1; min-width: 0; padding: 11px 14px; border-radius: 14px; border: 1px solid var(--line);
    background: rgba(255,255,255,.05); color: var(--text); font-size: 16px; outline: none; }
  #input:focus { border-color: rgba(255, 211, 96, .55); }
  #sendBtn { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); background: transparent; color: var(--accent); font-size: 17px; }
  #toast { position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 120px); padding: 12px 14px; border-radius: 14px;
    background: var(--panel); border: 1px solid var(--line); font-size: 13px; display: none; z-index: 5; backdrop-filter: blur(16px); }
  #toast.show { display: block; }
  #wfSheet { position: fixed; inset: 0; z-index: 7; background: var(--bg); display: none; flex-direction: column;
    padding: calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 10px); }
  #wfSheet.show { display: flex; }
  #wfSheet .top { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  #wfSheet h2 { font: 700 13px var(--mono); letter-spacing: .3em; margin: 0; flex: 1; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; margin-bottom: 6px; }
  .seg button { border: 0; border-radius: 9px; padding: 9px; background: transparent; color: var(--dim); font: 600 13px -apple-system, system-ui; }
  .seg button.on { background: var(--accent); color: #000; }
  .seghint { font-size: 12px; color: var(--dim); margin: 0 2px 14px; }
  #wfList { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
  .wf .h { display: flex; gap: 8px; align-items: baseline; }
  .wf .h .t { font-weight: 600; flex: 1; min-width: 0; }
  .wf .st { font: 600 9.5px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); white-space: nowrap; }
  .wf .st.done { color: var(--ok); } .wf .st.failed { color: var(--danger); } .wf .st.cancelled { color: var(--dim); }
  .bar { height: 4px; border-radius: 2px; background: rgba(255,255,255,.08); margin: 8px 0; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
  .wf .ag { display: flex; gap: 8px; font-size: 12.5px; padding: 3px 0; align-items: baseline; }
  .wf .ag b { font-weight: 600; white-space: nowrap; } .wf .ag span { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .wf .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font: 11px var(--mono); color: var(--dim); }
  .wf .foot a { color: var(--accent); text-decoration: none; font: 600 12px -apple-system, system-ui; }
  .wf .ctl { display: flex; gap: 6px; }
  .wf .ctl button { border: 1px solid var(--line); background: transparent; color: var(--dim); border-radius: 8px; padding: 3px 8px; font-size: 12px; }
  #pair { position: fixed; inset: 0; display: none; place-items: center; text-align: center; padding: 32px; background: var(--bg); z-index: 9; }
  #pair.show { display: grid; }
  #pair h1 { font: 700 18px var(--mono); letter-spacing: .3em; }
  #pair p { color: var(--dim); }
</style>
</head>
<body>
<div id="app">
  <header>
    <img src="logo.svg" alt="">
    <div><div class="brand">E.L.I.O.</div><div class="sub">DNA Factory</div></div>
    <span class="spacer"></span>
    <span id="conn" class="dot"></span>
    <button id="bell" class="icon-btn" title="Notifiche">🔔</button>
    <button id="wfBtn" class="icon-btn" title="Workflow">▦</button>
    <button id="voiceToggle" class="icon-btn" title="Voce">🔊</button>
  </header>
  <div id="orbWrap"><canvas id="orb"></canvas><div id="state">connessione…</div></div>
  <div id="partial"></div>
  <div id="feed"><div id="tasks"></div></div>
  <div id="dock">
    <button id="mic" type="button" aria-label="Parla con Elio">🎙</button>
    <div id="hint">TIENI PREMUTO O TOCCA PER PARLARE</div>
    <form id="form" autocomplete="off">
      <input id="input" placeholder="Scrivi a Elio…" enterkeyhint="send">
      <button id="sendBtn" type="submit" aria-label="Invia">➤</button>
    </form>
  </div>
</div>
<div id="toast"></div>
<div id="wfSheet">
  <div class="top"><h2>WORKFLOW</h2><button id="wfClose" class="icon-btn" aria-label="Chiudi">✕</button></div>
  <div class="seg" id="modeSeg"><button data-mode="talking">🗣 Parlante</button><button data-mode="silent">🤫 Silenziosa</button></div>
  <div class="seghint" id="modeHint"></div>
  <div id="wfList"></div>
</div>
<div id="pair"><div>
  <img src="logo.svg" alt="" style="height:48px;margin-bottom:14px">
  <h1>E.L.I.O.</h1>
  <p>Questo telefono non è ancora associato.<br>Sul Mac: Impostazioni di Elio → <b>Telefono</b> → "Pubblica e copia link".<br>Poi incollalo qui:</p>
  <input id="pairInput" placeholder="Incolla il link di associazione" style="width:100%;padding:12px;border-radius:12px;border:1px solid rgba(255,211,96,.3);background:rgba(255,255,255,.05);color:#FBF8F1;font-size:16px">
  <button id="pairBtn" class="act go" style="width:100%;margin-top:10px;padding:12px;border-radius:12px;border:0;background:#FFD360;color:#000;font-weight:600">Associa</button>
  <p id="pairErr" style="color:#FF6B61"></p>
</div></div>

<script>
"use strict";
// ---------- Pairing ----------
const params = new URLSearchParams(location.hash.slice(1));
if (params.get("pair")) {
  try { localStorage.setItem("elio.token", params.get("pair")); } catch {}
  history.replaceState(null, "", location.pathname);
}
let token = null;
try { token = localStorage.getItem("elio.token"); } catch {}
if (!token) document.getElementById("pair").classList.add("show");
// The app added to the Home Screen has its own storage: give it the pairing through its manifest.
if (token) document.getElementById("manifest").href = "manifest.webmanifest?pair=" + encodeURIComponent(token);
function pairWith(text) {
  const m = String(text).match(/pair=([A-Za-z0-9_-]+)/) || String(text).trim().match(/^([A-Za-z0-9_-]{20,})$/);
  if (!m) return false;
  try { localStorage.setItem("elio.token", m[1]); } catch {}
  location.replace(location.pathname);
  return true;
}

// ---------- State ----------
const $ = id => document.getElementById(id);
const feed = $("feed"), tasksEl = $("tasks");
let ws = null, state = "connessione…", level = 0, current = null;
let voiceOn = true;
try { voiceOn = localStorage.getItem("elio.voice") !== "off"; } catch {}
$("voiceToggle").textContent = voiceOn ? "🔊" : "🔇";
const tints = { listening: "#FFD360", thinking: "#FF9F43", speaking: "#F5C13F", hearing: "#FFE38A", offline: "#4A4843" };
function setState(s, label) {
  state = s;
  $("state").textContent = label || s;
  document.documentElement.style.setProperty("--tint", tints[s] || "#FFD360");
}

// ---------- Socket ----------
function wsURL() {
  // Local test: page on :8766, socket on :8767. Through `tailscale serve`: same origin, /ws.
  if (location.port === "8766") return `ws://${location.hostname}:8767`;
  return `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`;
}
function connect() {
  if (!token) return;
  ws = new WebSocket(wsURL(), ["elio", "t-" + token]);
  ws.onopen = () => { $("conn").classList.add("on"); setState("listening", "pronto"); };
  ws.onclose = () => { $("conn").classList.remove("on"); setState("offline", "offline"); setTimeout(connect, 2500); };
  ws.onmessage = e => { try { handle(JSON.parse(e.data)); } catch (err) { console.error(err); } };
}
function send(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }

// ---------- Messages ----------
function addMsg(role, text, meta) {
  const el = document.createElement("div");
  el.className = "msg " + role;
  const who = { user: "TU", elio: "ELIO", event: "AVVISO" }[role] || role.toUpperCase();
  el.innerHTML = `<div class="who">${who}<span class="meta"></span></div><div class="text"></div>`;
  el.querySelector(".text").textContent = text;
  if (meta) el.querySelector(".meta").textContent = meta;
  feed.appendChild(el);
  feed.scrollTop = feed.scrollHeight;
  return el;
}

const confirms = new Map();
const tasks = new Map();

function handle(m) {
  if (m.type === "event") return handleEvent(m);
  if (!current || m.id !== current.id) return;
  if (m.type === "delta") {
    current.text += m.text || "";
    current.el.querySelector(".text").textContent = current.text;
    feed.scrollTop = feed.scrollHeight;
  } else if (m.type === "done") {
    const text = m.route === "local" ? (m.text || "") : (current.text || m.text || "");
    current.el.querySelector(".text").textContent = text;
    current.el.querySelector(".meta").textContent = ` ${m.route || ""} ${m.latencyMs ?? ""}ms`;
    current = null;
    speak(text);
  } else if (m.type === "error") {
    current.el.querySelector(".text").textContent = "⚠️ " + (m.text || "errore");
    current = null;
    setState("listening", "pronto");
  }
}

function handleEvent(m) {
  switch (m.kind) {
    case "confirm": {
      const req = JSON.parse(m.payload || "{}");
      if (!req.id || confirms.has(req.id)) break;
      const el = document.createElement("div");
      const danger = req.risk === "dangerous";
      el.className = "card confirm" + (danger ? " danger" : "");
      el.innerHTML = `<div class="label">${danger ? "CONFERMA ESPLICITA" : "CONFERMA"}</div><div class="t"></div><pre></pre>
        <div class="row"><button class="act no">Annulla</button><button class="act go">${danger ? "Confermo" : "Procedi"}</button></div>`;
      el.querySelector(".t").textContent = req.title;
      el.querySelector("pre").textContent = req.detail;
      el.querySelector(".no").onclick = () => answer(req.id, false);
      el.querySelector(".go").onclick = () => answer(req.id, true);
      confirms.set(req.id, el);
      feed.appendChild(el);
      feed.scrollTop = feed.scrollHeight;
      if (navigator.vibrate) navigator.vibrate([60, 40, 60]);
      break;
    }
    case "question": {
      const q = JSON.parse(m.payload || "{}");
      if (!q.id || confirms.has(q.id)) break;
      const el = document.createElement("div");
      el.className = "card confirm";
      el.innerHTML = `<div class="label" style="color:#ff9f43">DOMANDA · <span class="from"></span></div><div class="t" style="margin:6px 0 8px"></div>
        <div class="row"><input class="ans" placeholder="La tua risposta…" style="flex:1;min-width:0;padding:10px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text);font-size:16px">
        <button class="act go" style="flex:none;padding:10px 14px">Invia</button></div>`;
      el.querySelector(".from").textContent = q.from || "";
      el.querySelector(".t").textContent = q.question;
      const submit = () => {
        const v = el.querySelector(".ans").value.trim();
        if (!v) return;
        send({ type: "answer", id: q.id, text: v });
        el.remove(); confirms.delete(q.id);
        addMsg("user", "↳ " + v);
      };
      el.querySelector(".go").onclick = submit;
      el.querySelector(".ans").onkeydown = e => { if (e.key === "Enter") submit(); };
      confirms.set(q.id, el);
      feed.appendChild(el);
      feed.scrollTop = feed.scrollHeight;
      if (navigator.vibrate) navigator.vibrate([60, 40, 60]);
      break;
    }
    case "questionResolved":
    case "confirmResolved": {
      const el = confirms.get(m.id);
      if (el) { el.remove(); confirms.delete(m.id); }
      break;
    }
    case "task": case "taskDone": {
      const t = JSON.parse(m.payload || "{}");
      if (t.id) { tasks.set(t.id, t); renderTasks(); }
      refreshWorkflows();
      break;
    }
    case "workflowEvent": case "squad": case "squadDone":
      refreshWorkflows();
      break;
    case "mode":
      setMode(m.text);
      break;
  }
  if (m.speak && m.text) { addMsg("event", m.text); speak(m.text); }
}

function renderTasks() {
  const list = [...tasks.values()].slice(-4).reverse();
  tasksEl.innerHTML = "";
  if (!list.length) return;
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `<div class="label" style="font:600 10px var(--mono);letter-spacing:.2em;color:var(--dim);margin-bottom:8px">WORKFLOW</div>`;
  for (const t of list) {
    const row = document.createElement("div");
    row.className = "task";
    row.innerHTML = `<span class="s ${t.status}"></span><div style="min-width:0"><div class="n"></div><div class="step"></div></div>`;
    row.querySelector(".n").textContent = t.title + (t.project ? ` · ${t.project}` : "");
    row.querySelector(".step").textContent = t.status === "running" ? (t.steps || []).slice(-1)[0] || "" : (t.summary || t.status).slice(0, 120);
    card.appendChild(row);
  }
  tasksEl.appendChild(card);
}

function answer(id, approved) {
  send({ type: "confirm", id, approved });
  const el = confirms.get(id);
  if (el) { el.remove(); confirms.delete(id); }
  addMsg("user", approved ? "✓ Confermato" : "✕ Annullato");
}

function say(text) {
  text = text.trim();
  if (!text) return;
  unlockAudio();
  const id = crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random());
  addMsg("user", text);
  current = { id, text: "", el: addMsg("elio", "…") };
  setState("thinking", "elaboro");
  send({ type: "say", id, text });
}

// ---------- Workflows: progress, mode, reports ----------
let mode = "talking", wfOpen = false, wfTimer = null;
const STATUS = { running: "in corso", done: "completato", failed: "fallito", cancelled: "fermato" };
function setMode(m) {
  mode = m === "silent" ? "silent" : "talking";
  document.querySelectorAll("#modeSeg button").forEach(b => b.classList.toggle("on", b.dataset.mode === mode));
  $("modeHint").textContent = mode === "silent"
    ? "Elio sta zitto mentre gli agenti lavorano: ti cerca solo per domande, problemi e alla fine."
    : "Elio ti racconta i progressi e le decisioni che prende al posto tuo.";
}
$("modeSeg").onclick = e => {
  const m = e.target.closest("button")?.dataset.mode;
  if (!m) return;
  setMode(m);
  send({ type: "mode", text: m });
};
function refreshWorkflows() {
  if (!wfOpen) return;
  clearTimeout(wfTimer);
  wfTimer = setTimeout(loadWorkflows, 400);
}
async function loadWorkflows() {
  try {
    const r = await fetch("api/workflows", { headers: { "X-Elio-Token": token } });
    if (!r.ok) throw new Error(r.status);
    const feed = await r.json();
    setMode(feed.mode);
    renderWorkflows(feed.workflows || []);
  } catch { $("wfList").innerHTML = `<div class="card" style="color:var(--dim)">Non riesco a leggere i workflow dal Mac.</div>`; }
}
function renderWorkflows(list) {
  const el = $("wfList");
  el.innerHTML = "";
  if (!list.length) { el.innerHTML = `<div class="card" style="color:var(--dim)">Nessun workflow ancora. Chiedi a Elio di mettere su una squadra.</div>`; return; }
  for (const w of list) {
    const wf = w.workflow, agents = w.agents || [];
    const workers = agents.filter(a => a.kind !== "lead");
    const done = workers.filter(a => ["done", "failed", "cancelled"].includes(a.status)).length;
    const pct = wf.status === "running" ? Math.round(100 * done / Math.max(1, workers.length)) : 100;
    const cost = agents.reduce((s, a) => s + (a.costUSD || 0), 0);
    const card = document.createElement("div");
    card.className = "card wf";
    card.innerHTML = `<div class="h"><span class="t"></span><span class="st ${wf.status}">${STATUS[wf.status] || wf.status}${w.pending ? " · attende te" : ""}</span></div>
      <div class="bar"><i style="width:${pct}%"></i></div><div class="ags"></div>
      <div class="foot"><span>${new Date(wf.startedAt).toLocaleString("it-IT", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })} · $${cost.toFixed(2)}</span>
      <a href="report.html?id=${encodeURIComponent(wf.id)}">Report →</a></div>`;
    card.querySelector(".t").textContent = wf.title;
    const ags = card.querySelector(".ags");
    for (const a of agents) {
      const row = document.createElement("div");
      row.className = "ag";
      const active = ["running", "waitingConfirmation", "paused"].includes(a.status);
      row.innerHTML = `<span class="s ${a.status}" style="width:7px;height:7px;border-radius:50%;flex:none;align-self:center;background:${
        { done: "var(--ok)", failed: "var(--danger)", waitingConfirmation: "var(--warn)", cancelled: "var(--dim)" }[a.status] || "var(--accent)"}"></span><b></b><span></span>`;
      row.querySelector("b").textContent = a.member || "agente";
      row.querySelector("span:last-child").textContent = active ? (a.lastMessage || (a.steps || []).slice(-1)[0] || a.role || "") : (a.summary || a.status).split("\n")[0];
      if (active) {
        const ctl = document.createElement("span");
        ctl.className = "ctl";
        ctl.innerHTML = `<button data-a="${a.status === "paused" ? "resume" : "pause"}">${a.status === "paused" ? "▶" : "⏸"}</button><button data-a="stop">■</button>`;
        ctl.onclick = e => { const act = e.target.dataset.a; if (act) { send({ type: "taskControl", id: a.id, text: act }); setTimeout(loadWorkflows, 600); } };
        row.appendChild(ctl);
      }
      ags.appendChild(row);
    }
    el.appendChild(card);
  }
}
$("wfBtn").onclick = () => { wfOpen = true; $("wfSheet").classList.add("show"); loadWorkflows(); };
$("wfClose").onclick = () => { wfOpen = false; $("wfSheet").classList.remove("show"); };

// ---------- Voice out (ElevenLabs via the Mac) ----------
const audio = new Audio();
let audioUnlocked = false, speakQueue = Promise.resolve();
function silentWav() {
  // 0.05s of silence, 8 kHz mono 16-bit.
  const n = 400, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  const w = (o, str) => [...str].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  w(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); w(8, "WAVE"); w(12, "fmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, 8000, true); v.setUint32(28, 16000, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  w(36, "data"); v.setUint32(40, n * 2, true);
  return URL.createObjectURL(new Blob([buf], { type: "audio/wav" }));
}
function unlockAudio() {
  // iOS: audio can only start from a user gesture; play a silent clip once to unlock.
  if (audioUnlocked) return;
  audioUnlocked = true;
  audio.src = silentWav();
  audio.play().catch(() => {});
}
function speak(text) {
  if (!voiceOn || !text) { setState("listening", "pronto"); return; }
  speakQueue = speakQueue.then(async () => {
    try {
      const r = await fetch("tts", { method: "POST", headers: { "Content-Type": "application/json", "X-Elio-Token": token },
                                      body: JSON.stringify({ text }) });
      if (!r.ok) throw new Error(r.status);
      const url = URL.createObjectURL(await r.blob());
      setState("speaking", "parlo");
      audio.src = url;
      await audio.play();
      await new Promise(res => { audio.onended = res; audio.onerror = res; });
      URL.revokeObjectURL(url);
    } catch (e) { console.warn("tts", e); }
    setState("listening", "pronto");
  });
}
$("voiceToggle").onclick = () => {
  voiceOn = !voiceOn;
  try { localStorage.setItem("elio.voice", voiceOn ? "on" : "off"); } catch {}
  $("voiceToggle").textContent = voiceOn ? "🔊" : "🔇";
  if (!voiceOn) audio.pause();
};

// ---------- Voice in: record here, transcribe on the Mac ----------
// Safari's dictation isn't reliable in home-screen apps: the audio goes to the Mac (ElevenLabs Scribe).
let recorder = null, chunks = [], stream = null, analyser = null, downAt = 0, held = false;
function toast(text, ms = 3500) { const t = $("toast"); t.textContent = text; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), ms); }
async function startRec() {
  unlockAudio();
  audio.pause();
  try {
    stream = stream || await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
  } catch { toast("Serve il permesso del microfono: Impostazioni → Safari/Elio → Microfono."); return; }
  const type = ["audio/mp4", "audio/webm;codecs=opus", "audio/webm"].find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || "";
  chunks = [];
  recorder = new MediaRecorder(stream, type ? { mimeType: type } : undefined);
  recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  recorder.onstop = upload;
  recorder.start();
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    analyser = ac.createAnalyser(); analyser.fftSize = 256;
    ac.createMediaStreamSource(stream).connect(analyser);
  } catch {}
  $("mic").classList.add("rec");
  $("hint").textContent = "TI ASCOLTO… RILASCIA O TOCCA PER INVIARE";
  setState("hearing", "ti ascolto");
}
function stopRec() {
  if (!recorder || recorder.state === "inactive") return;
  recorder.stop();
  $("mic").classList.remove("rec");
  $("hint").textContent = "TIENI PREMUTO O TOCCA PER PARLARE";
  analyser = null;
}
async function upload() {
  const blob = new Blob(chunks, { type: recorder.mimeType || "audio/mp4" });
  if (blob.size < 2000) { setState("listening", "pronto"); return; }
  setState("thinking", "trascrivo");
  $("partial").textContent = "…";
  try {
    const r = await fetch("stt", { method: "POST", headers: { "Content-Type": blob.type, "X-Elio-Token": token }, body: blob });
    if (!r.ok) throw new Error(r.status);
    const { text } = await r.json();
    $("partial").textContent = "";
    if (text) say(text); else { setState("listening", "pronto"); toast("Non ho sentito nulla."); }
  } catch (e) { $("partial").textContent = ""; setState("listening", "pronto"); toast("Non sono riuscito a trascrivere: riprova."); }
}
// Hold to talk, or tap to start and tap again to send.
$("mic").addEventListener("pointerdown", e => {
  e.preventDefault();
  if (recorder && recorder.state === "recording") { stopRec(); return; }
  downAt = Date.now(); held = true; startRec();
});
$("mic").addEventListener("pointerup", e => {
  e.preventDefault();
  if (held && Date.now() - downAt > 450) stopRec();   // it was a hold: release sends
  held = false;
});
$("mic").addEventListener("pointercancel", () => { held = false; stopRec(); });

$("form").onsubmit = e => { e.preventDefault(); say($("input").value); $("input").value = ""; $("input").blur(); };

// ---------- Notifications (Web Push) ----------
$("pairBtn").onclick = () => { if (!pairWith($("pairInput").value)) $("pairErr").textContent = "Link non valido."; };
$("pairInput").addEventListener("paste", e => setTimeout(() => pairWith($("pairInput").value), 50));

function b64ToBytes(s) { s = s.replace(/-/g, "+").replace(/_/g, "/"); s += "=".repeat((4 - s.length % 4) % 4);
  return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }
async function refreshBell() {
  const ok = "Notification" in window && Notification.permission === "granted";
  $("bell").classList.toggle("hot", !ok);
  $("bell").style.display = ok ? "none" : "";
}
$("bell").onclick = async () => {
  const standalone = navigator.standalone || matchMedia("(display-mode: standalone)").matches;
  if (!("PushManager" in window) || !("Notification" in window)) {
    toast(standalone ? "Questo iPhone non supporta le notifiche web (serve iOS 16.4 o successivo)."
                     : "Prima aggiungi Elio alla schermata Home (Condividi → Aggiungi a Home) e aprilo da lì.", 6000);
    return;
  }
  const perm = await Notification.requestPermission();
  if (perm !== "granted") { toast("Notifiche non consentite."); return; }
  try {
    const reg = await navigator.serviceWorker.ready;
    const { key } = await (await fetch("push/key")).json();
    const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(key) });
    const r = await fetch("push/subscribe", { method: "POST", headers: { "Content-Type": "application/json", "X-Elio-Token": token },
                                               body: JSON.stringify(sub.toJSON()) });
    toast(r.ok ? "Notifiche attive: arriveranno quando non sei al Mac." : "Non sono riuscito ad attivarle.");
  } catch (e) { toast("Non sono riuscito ad attivarle: " + e.message); }
  refreshBell();
};
refreshBell();

// ---------- Orb ----------
const cv = $("orb"), cx = cv.getContext("2d");
const neurons = Array.from({ length: 56 }, (_, i) => {
  let s = i * 9301 + 49297; const r = () => ((s = (s * 233280 + 49297) % 233280) / 233280);
  return { ph: r() * 6.28, sp: (0.4 + r() * 0.9) * (r() > .5 ? 1 : -1), rad: .3 + r() * .5, tilt: .55 + r() * .45, sz: 1.4 + r() * 2.2 };
});
function frame(t) {
  const dpr = devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  if (cv.width !== w * dpr) { cv.width = w * dpr; cv.height = h * dpr; }
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cx.clearRect(0, 0, w, h);
  const tint = getComputedStyle(document.documentElement).getPropertyValue("--tint").trim() || "#FFD360";
  const R = Math.min(w, h) / 2.1, c = { x: w / 2, y: h / 2 }, time = t / 1000;
  const energy = { thinking: 1, speaking: .8, hearing: .75, offline: .15 }[state] ?? .35;
  level *= 0.93;
  if (analyser) { const d = new Uint8Array(analyser.frequencyBinCount); analyser.getByteFrequencyData(d);
    level = Math.max(level, Math.min(1, d.reduce((a, b) => a + b, 0) / d.length / 60)); }
  const g = cx.createRadialGradient(c.x, c.y, 0, c.x, c.y, R);
  g.addColorStop(0, tint + "44"); g.addColorStop(1, "transparent");
  cx.fillStyle = g; cx.beginPath(); cx.arc(c.x, c.y, R, 0, 7); cx.fill();
  const pts = neurons.map((n, i) => {
    const a = n.ph + time * (0.12 + energy * .5) * n.sp, rr = R * (n.rad + Math.sin(time * .8 + n.ph) * .05 + level * .08);
    return [c.x + Math.cos(a) * rr, c.y + Math.sin(a) * rr * n.tilt, n.sz];
  });
  const maxD = R * (.38 + energy * .12);
  cx.lineWidth = .7;
  for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) {
    const d = Math.hypot(pts[i][0] - pts[j][0], pts[i][1] - pts[j][1]);
    if (d > maxD) continue;
    const fire = state === "thinking" ? (Math.sin(time * 6 + i * 7 + j) + 1) / 2 : .3;
    cx.strokeStyle = tint; cx.globalAlpha = (1 - d / maxD) * (.12 + .35 * energy * fire);
    cx.beginPath(); cx.moveTo(pts[i][0], pts[i][1]); cx.lineTo(pts[j][0], pts[j][1]); cx.stroke();
  }
  cx.globalAlpha = .55 + .45 * energy; cx.fillStyle = tint;
  for (const p of pts) { cx.beginPath(); cx.arc(p[0], p[1], p[2] / 2 * (1 + level), 0, 7); cx.fill(); }
  cx.globalAlpha = 1;
  for (const [k, ring] of [[0, [.92, 1]], [1, [.8, -1.6]]]) {
    const n = k ? 5 : 3;
    for (let s = 0; s < n; s++) {
      const st = time * (0.12 + energy * .5) * ring[1] + s * 6.283 / n;
      cx.strokeStyle = tint; cx.globalAlpha = .35 + .3 * energy; cx.lineWidth = k ? 2.2 : 1.2;
      cx.beginPath(); cx.arc(c.x, c.y, R * ring[0], st, st + (k ? .5 : 1.4)); cx.stroke();
    }
  }
  cx.globalAlpha = 1;
  const core = R * (.16 + level * .07 + (state === "speaking" ? Math.sin(time * 9) * .015 : 0));
  const cg = cx.createRadialGradient(c.x, c.y, 0, c.x, c.y, core);
  cg.addColorStop(0, "#ffffff"); cg.addColorStop(.5, tint); cg.addColorStop(1, "transparent");
  cx.fillStyle = cg; cx.beginPath(); cx.arc(c.x, c.y, core, 0, 7); cx.fill();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
connect();
