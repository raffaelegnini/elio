<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0E10">
<title>Workflow Report</title>
<link rel="icon" href="logo.svg">
<style>
  :root {
    color-scheme: dark;
    --bg: #0E0E10; --surface: #141416; --surface-2: #1b1b1e; --line: rgba(255, 255, 255, .08); --grid: rgba(255, 255, 255, .06);
    --text: #FBF8F1; --text-2: #c3c0b6; --muted: #8d8a80; --accent: #FFD360;
    --good: #4ade80; --warn: #FF9F43; --bad: #FF6B61;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      color-scheme: light;
      --bg: #f4f2ec; --surface: #fbfaf7; --surface-2: #f1efe9; --line: rgba(0, 0, 0, .09); --grid: rgba(0, 0, 0, .06);
      --text: #17160f; --text-2: #4d4b44; --muted: #7a776d; --accent: #9a6b00;
      --good: #12803c; --warn: #b85c00; --bad: #c4312a;
      --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
    }
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f4f2ec; --surface: #fbfaf7; --surface-2: #f1efe9; --line: rgba(0, 0, 0, .09); --grid: rgba(0, 0, 0, .06);
    --text: #17160f; --text-2: #4d4b44; --muted: #7a776d; --accent: #9a6b00;
    --good: #12803c; --warn: #b85c00; --bad: #c4312a;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  main { max-width: 1180px; margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 12px) max(16px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 64px) max(16px, env(safe-area-inset-left)); }
  .ic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; vertical-align: -3px; }
  .ic.xs { width: 14px; height: 14px; vertical-align: -2px; }
  .back { display: inline-flex; align-items: center; gap: 2px; min-height: 44px; margin-left: -6px; color: var(--accent); text-decoration: none; font-size: 16px; }
  .back .ic { width: 24px; height: 24px; }
  .eyebrow { font-size: 13px; font-weight: 600; color: var(--muted); }
  h1 { font-size: 28px; line-height: 1.2; margin: 4px 0 10px; font-weight: 700; letter-spacing: -.01em; text-wrap: balance; }
  h2 { font-size: 15px; font-weight: 600; color: var(--text); margin: 0 0 14px; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--text-2); font-size: 13px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600;
    padding: 2px 9px; border-radius: 99px; background: var(--grid); }
  .st-running { color: var(--accent); } .st-done { color: var(--good); } .st-failed { color: var(--bad); } .st-cancelled { color: var(--muted); }
  .summary { margin: 18px 0 0; padding: 14px 16px; background: var(--surface); border-radius: 14px;
    color: var(--text-2); white-space: pre-wrap; max-height: 260px; overflow: auto; }
  section { margin-top: 28px; }
  .panel { background: var(--surface); border-radius: 16px; padding: 18px; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-top: 22px; }
  .kpi { background: var(--surface); border-radius: 14px; padding: 12px 14px; }
  .kpi .v { font-size: 24px; font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .kpi .l { font-size: 12.5px; font-weight: 600; color: var(--muted); }
  .kpi .s { color: var(--muted); font-size: 12px; }
  svg { display: block; width: 100%; overflow: visible; }
  svg text { fill: var(--muted); font: 11px var(--mono); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-bottom: 10px; font-size: 12px; color: var(--text-2); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .legend .mk { font-style: normal; color: var(--text-2); margin-right: 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 6px 8px;
    border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  td.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .who { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; white-space: nowrap; }
  .who i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .scroll { overflow-x: auto; }
  .list { display: flex; flex-direction: column; gap: 10px; }
  .item { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
  .item .h { display: flex; gap: 8px; align-items: baseline; font-size: 12px; color: var(--muted); margin-bottom: 3px; flex-wrap: wrap; }
  .item .b { white-space: pre-wrap; word-break: break-word; }
  .item .r { color: var(--text-2); font-size: 13px; margin-top: 4px; display: flex; gap: 6px; align-items: flex-start; }
  .item .r .ic { margin-top: 2px; color: var(--muted); }
  .item ul { margin: 4px 0 0; padding-left: 18px; color: var(--text-2); font-size: 13px; }
  .tag { font-size: 11.5px; font-weight: 600; padding: 1px 7px; border-radius: 6px; background: var(--grid); color: var(--text-2); }
  .tag.fix { color: var(--warn); } .tag.ask { color: var(--accent); } .tag.ok { color: var(--good); } .tag.bad { color: var(--bad); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .chip { border: 0; background: var(--grid); color: var(--text-2); border-radius: 99px; padding: 0 12px; min-height: 32px; font-size: 13px; cursor: pointer; }
  .chip.on { background: var(--text); color: var(--bg); border-color: transparent; }
  .feed { max-height: 520px; overflow: auto; }
  .ev { display: grid; grid-template-columns: 54px 110px 1fr; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .ev .t { font: 11px var(--mono); color: var(--muted); padding-top: 2px; }
  .ev .b { white-space: pre-wrap; word-break: break-word; color: var(--text-2); }
  .agents { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
  .agent { background: var(--surface); border-radius: 14px; padding: 14px; }
  .agent .role { color: var(--muted); font-size: 12px; margin: 2px 0 8px; }
  .agent details { margin-top: 8px; font-size: 12.5px; color: var(--text-2); }
  .agent summary { cursor: pointer; color: var(--muted); font-size: 12.5px; font-weight: 600; min-height: 32px; display: flex; align-items: center; }
  .agent code { font: 11.5px var(--mono); display: block; white-space: pre-wrap; word-break: break-all; color: var(--text-2); padding: 2px 0; }
  .empty { color: var(--muted); font-size: 13px; padding: 6px 0; }
  #tip { position: fixed; pointer-events: none; z-index: 9; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 10px; font-size: 12px; max-width: 320px; box-shadow: 0 8px 30px rgba(0,0,0,.35); display: none; white-space: pre-wrap; }
  #tip b { display: block; margin-bottom: 2px; }
  .wf-list a { display: flex; gap: 12px; align-items: center; min-height: 52px; padding: 10px 0; border-bottom: 1px solid var(--line); color: var(--text); text-decoration: none; }
  .wf-list a:last-child { border-bottom: 0; }
  .wf-list .d { color: var(--muted); font-size: 12px; margin-left: auto; white-space: nowrap; }
  footer { margin-top: 36px; color: var(--muted); font: 11px var(--mono); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  button.link { background: none; border: 0; color: var(--accent); cursor: pointer; font: inherit; padding: 0; }
  @media (max-width: 600px) {
    h1 { font-size: 21px; }
    .ev { grid-template-columns: 44px 1fr; } .ev .a { grid-column: 2; }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="i-reply" viewBox="0 0 24 24"><path d="m15 10 5 5-5 5"/><path d="M4 4v7a4 4 0 0 0 4 4h12"/></symbol>
</svg>
<main id="root"><p class="empty">Carico il report…</p></main>
<div id="tip"></div>
<script>
"use strict";
// Filled in by Elio when the report is saved as a file; otherwise fetched live from the Mac.
const EMBEDDED = /*__ELIO_REPORT__*/null;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const token = (() => { try { return localStorage.getItem("elio.token"); } catch { return null; } })();
const query = new URLSearchParams(location.search);

const icon = (name, cls = "") => `<svg class="ic ${cls}"><use href="#i-${name}"/></svg>`;
// Inside the app there is no browser chrome: a way back to the Workflow tab. Not in reports saved as files.
const back = () => EMBEDDED ? "" : `<a class="back" href="./#workflow">${icon("back")}Workflow</a>`;

const SLOTS = ["--s1", "--s2", "--s3", "--s4", "--s5", "--s6", "--s7", "--s8"];
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

const fmt = {
  time: d => new Date(d).toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" }),
  date: d => new Date(d).toLocaleString("it-IT", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }),
  dur: s => { s = Math.max(0, Math.round(s)); if (s < 60) return s + " s"; const m = Math.round(s / 60); return m < 60 ? m + " min" : Math.floor(m / 60) + " h " + String(m % 60).padStart(2, "0"); },
  tok: n => n >= 1e6 ? (n / 1e6).toFixed(1).replace(".", ",") + " M" : n >= 1e3 ? Math.round(n / 1e3) + " k" : String(n || 0),
  usd: n => "$" + (n || 0).toFixed(2),
};

const STATUS_IT = { running: "in corso", done: "completato", failed: "fallito", cancelled: "fermato",
  waitingConfirmation: "attende conferma", paused: "in pausa" };
const KIND = {
  started: "Avvio", agentStarted: "Agente al lavoro", agentDone: "Agente ha finito", agentFailed: "Errore agente",
  message: "Bacheca", progress: "Aggiornamento", alert: "Problema", question: "Domanda", answer: "Risposta",
  autoDecision: "Deciso da Elio", confirm: "Conferma richiesta", confirmResult: "Esito conferma",
  tasteViolation: "Gusto violato", tasteCorrection: "Correzione chiesta", tasteOk: "Gusto rispettato",
  leadWake: "Elio rivede", finished: "Fine",
};
const GROUPS = {
  "Tutto": null,
  "Decisioni": ["autoDecision", "question", "answer", "confirm", "confirmResult"],
  "Gusto": ["tasteViolation", "tasteCorrection", "tasteOk"],
  "Problemi": ["agentFailed", "alert"],
  "Bacheca": ["message"],
  "Agenti": ["agentStarted", "agentDone", "agentFailed", "progress"],
};

// ---------- Loading ----------
async function api(path) {
  const r = await fetch(path, { headers: { "X-Elio-Token": token || "" } });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

async function boot() {
  if (EMBEDDED) return render(EMBEDDED, false);
  const id = query.get("id");
  if (!id) return renderList();
  try {
    const data = await api("api/workflow?id=" + encodeURIComponent(id));
    render(data, true);
    if (data.workflow.status === "running") setTimeout(boot, 10000);
  } catch (e) {
    $("#root").innerHTML = `${back()}<p class="empty">${token ? "Report non trovato." : "Apri il report dall'app Elio sul telefono (serve l'associazione)."}</p>`;
  }
}

async function renderList() {
  try {
    const feed = await api("api/workflows");
    $("#root").innerHTML = `${back()}<div class="eyebrow">Elio · Workflow</div><h1>Report dei workflow</h1>
      <div class="panel wf-list">${feed.workflows.map(w => `<a href="?id=${encodeURIComponent(w.workflow.id)}">
        <span class="pill st-${esc(w.workflow.status)}">${esc(STATUS_IT[w.workflow.status] || w.workflow.status)}</span><span>${esc(w.workflow.title)}</span>
        <span class="d">${fmt.date(w.workflow.startedAt)}</span></a>`).join("") || `<p class="empty">Nessun workflow ancora.</p>`}</div>`;
  } catch { $("#root").innerHTML = `<p class="empty">Non riesco a raggiungere Elio.</p>`; }
}

// ---------- Model ----------
function model(r) {
  const wf = r.workflow;
  const t0 = new Date(wf.startedAt).getTime();
  const now = new Date(r.generatedAt).getTime();
  const end = wf.endedAt ? new Date(wf.endedAt).getTime() : now;
  // Fixed color per agent, by first appearance: never re-assigned when the list changes.
  const agents = r.agents.map((a, i) => {
    const info = a.info;
    const s = new Date(info.startedAt).getTime();
    const e = info.endedAt && !["running", "waitingConfirmation", "paused"].includes(info.status) ? new Date(info.endedAt).getTime() : now;
    return { ...a, key: info.member || "main", name: info.member || "agente", color: `var(${SLOTS[i % SLOTS.length]})`,
             start: s, end: Math.max(e, s), lead: info.kind === "lead" };
  });
  const byActor = Object.fromEntries(agents.map(a => [a.name, a]));
  if (!byActor.agente && agents.length === 1) byActor.agente = agents[0];
  const ev = [...r.events].sort((a, b) => new Date(a.ts) - new Date(b.ts) || a.id - b.id).map(e => ({ ...e, t: new Date(e.ts).getTime(), d: (() => { try { return JSON.parse(e.data || "null") || {}; } catch { return {}; } })() }));
  const count = k => ev.filter(e => e.kind === k).length;
  const cost = agents.reduce((s, a) => s + (a.info.costUSD || 0), 0)
    + ev.reduce((s, e) => s + (["autoDecision", "tasteOk"].includes(e.kind) ? (e.d.costUSD || 0) : 0), 0);
  const tokens = agents.reduce((s, a) => s + (a.info.tokensIn || 0) + (a.info.tokensOut || 0), 0);
  return { r, wf, t0, end, now, agents, byActor, ev, count, cost, tokens };
}

// ---------- Render ----------
function render(r, live) {
  const m = model(r);
  const { wf } = m;
  document.title = wf.title + " · Report";
  const dur = (m.end - m.t0) / 1000;
  const active = m.agents.reduce((s, a) => s + (a.info.activeSeconds || (a.end - a.start) / 1000), 0);
  const corrections = m.count("tasteCorrection"), violations = m.count("tasteViolation");
  const decisions = m.count("autoDecision"), questions = m.count("question") - decisions;

  $("#root").innerHTML = `${back()}
    <div class="eyebrow">Elio · Report workflow · ${wf.kind === "squad" ? "squadra" : "task"}</div>
    <h1>${esc(wf.title)}</h1>
    <div class="meta"><span class="pill st-${esc(wf.status)}">${esc(STATUS_IT[wf.status] || wf.status)}</span>
      ${wf.project ? `<span>${esc(wf.project)}</span>` : ""}<span>${fmt.date(wf.startedAt)}</span>
      <span>modalità ${r.mode === "silent" ? "silenziosa" : "parlante"}</span>
      ${live ? `<span>aggiornato ${fmt.time(r.generatedAt)}</span>` : ""}</div>
    ${wf.summary ? `<div class="summary">${esc(wf.summary)}</div>` : ""}

    <div class="kpis">
      ${kpi("Durata", fmt.dur(dur), `${fmt.dur(active)} di lavoro agenti`)}
      ${kpi("Agenti", m.agents.length, `${m.agents.filter(a => a.info.status === "done").length} completati`)}
      ${kpi("Costo API", fmt.usd(m.cost), "equivalente, incl. revisioni")}
      ${kpi("Token", fmt.tok(m.tokens), "input + output")}
      ${kpi("Deciso da Elio", decisions, `${Math.max(0, questions)} domande arrivate a te`)}
      ${kpi("Correzioni di gusto", corrections, `${violations} violazioni trovate`)}
    </div>

    <section class="panel"><h2>Timeline degli agenti</h2><div id="gantt"></div></section>

    <section class="grid2">
      <div class="panel"><h2>Costo per agente</h2><div id="cost"></div></div>
      <div class="panel"><h2>Ritmo di lavoro · azioni al minuto</h2><div id="pace"></div></div>
    </section>

    <section class="panel"><h2>Attività per agente</h2><div class="scroll" id="activity"></div></section>

    <section class="grid2">
      <div class="panel"><h2>Decisioni prese al posto tuo</h2><div id="decisions" class="list"></div></div>
      <div class="panel"><h2>Il tuo gusto, applicato</h2><div id="taste"></div></div>
    </section>

    <section><h2>Agenti</h2><div class="agents" id="agents"></div></section>

    <section class="panel"><h2>Cronologia</h2><div class="chips" id="chips"></div><div class="feed" id="feed"></div></section>

    <footer><span>Generato da Elio · ${fmt.date(r.generatedAt)}</span><span>id ${esc(wf.id)}</span></footer>`;

  gantt(m); costChart(m); pace(m); activity(m); decisionsList(m); taste(m); agentCards(m); feed(m, "Tutto");
}

const kpi = (l, v, s) => `<div class="kpi"><div class="l">${esc(l)}</div><div class="v">${esc(v)}</div><div class="s">${esc(s)}</div></div>`;

// ---------- Tooltip ----------
const tip = $("#tip");
function bindTip(el) {
  el.addEventListener("pointermove", e => {
    const t = e.target.closest("[data-tip]");
    if (!t) { tip.style.display = "none"; return; }
    tip.innerHTML = t.getAttribute("data-tip");
    tip.style.display = "block";
    const w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.min(innerWidth - w - 8, e.clientX + 14) + "px";
    tip.style.top = (e.clientY + h + 24 > innerHeight ? e.clientY - h - 12 : e.clientY + 14) + "px";
  });
  el.addEventListener("pointerleave", () => tip.style.display = "none");
}
// Escaped twice: once for the HTML the tooltip shows, once for the attribute that carries it.
const tipText = (title, body) => esc(`<b>${esc(title)}</b>${esc(body)}`);

// ---------- Gantt ----------
const MARKS = {
  autoDecision: { shape: "circle", label: "deciso da Elio", color: "var(--accent)" },
  question: { shape: "diamond", label: "domanda a te", color: "var(--warn)" },
  tasteCorrection: { shape: "triangle", label: "correzione di gusto", color: "var(--warn)" },
  tasteViolation: null,
  agentFailed: { shape: "cross", label: "errore", color: "var(--bad)" },
  alert: { shape: "cross", label: "problema", color: "var(--bad)" },
  confirm: { shape: "square", label: "conferma", color: "var(--text-2)" },
};
function markPath(shape, x, y, r) {
  switch (shape) {
    case "diamond": return `<path d="M${x} ${y - r}L${x + r} ${y}L${x} ${y + r}L${x - r} ${y}Z"`;
    case "triangle": return `<path d="M${x} ${y - r}L${x + r} ${y + r * .8}L${x - r} ${y + r * .8}Z"`;
    case "square": return `<rect x="${x - r * .8}" y="${y - r * .8}" width="${r * 1.6}" height="${r * 1.6}" rx="1.5"`;
    case "cross": return `<path d="M${x - r} ${y - r}L${x + r} ${y + r}M${x + r} ${y - r}L${x - r} ${y + r}" stroke-width="2.4" fill="none"`;
    default: return `<circle cx="${x}" cy="${y}" r="${r * .85}"`;
  }
}
function gantt(m) {
  const box = $("#gantt");
  if (!m.agents.length) { box.innerHTML = `<p class="empty">Nessun agente.</p>`; return; }
  const W = Math.max(640, box.clientWidth), L = 120, R = 16, rowH = 30, top = 8;
  const H = top + m.agents.length * rowH + 28;
  const span = Math.max(60000, m.end - m.t0);
  const x = t => L + (W - L - R) * Math.min(1, Math.max(0, (t - m.t0) / span));
  let s = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Timeline degli agenti">`;
  // Recessive time grid.
  const ticks = 6;
  for (let i = 0; i <= ticks; i++) {
    const t = m.t0 + span * i / ticks, xx = x(t);
    s += `<line x1="${xx}" x2="${xx}" y1="${top}" y2="${H - 22}" stroke="var(--grid)"/>`;
    s += `<text x="${xx}" y="${H - 6}" text-anchor="${i === 0 ? "start" : i === ticks ? "end" : "middle"}">${fmt.time(t)}</text>`;
  }
  m.agents.forEach((a, i) => {
    const y = top + i * rowH + rowH / 2;
    s += `<text x="0" y="${y + 4}" style="fill:var(--text-2);font-weight:600">${esc(a.name.slice(0, 15))}</text>`;
    const x1 = x(a.start), x2 = Math.max(x1 + 4, x(a.end));
    const running = ["running", "waitingConfirmation", "paused"].includes(a.info.status);
    s += `<rect x="${x1}" y="${y - 6}" width="${x2 - x1}" height="12" rx="4" fill="${a.color}" opacity="${running ? .55 : .9}"
      data-tip="${tipText(a.name, `\n${a.info.role || ""}\n${fmt.time(a.start)}–${running ? "in corso" : fmt.time(a.end)} · ${fmt.dur((a.info.activeSeconds || (a.end - a.start) / 1000))} di lavoro\n${fmt.usd(a.info.costUSD)} · ${fmt.tok((a.info.tokensIn || 0) + (a.info.tokensOut || 0))} token`)}"/>`;
    // Moments that matter, on the agent's row.
    for (const e of m.ev) {
      const mk = MARKS[e.kind];
      if (!mk) continue;
      const who = e.d.agent || e.actor;
      if (who !== a.name && !(a.key === "main" && m.agents.length === 1)) continue;
      const xx = x(e.t);
      const body = e.kind === "autoDecision" ? `\nD: ${e.d.question || ""}\nR: ${e.text}` : `\n${e.text.slice(0, 280)}`;
      s += `${markPath(mk.shape, xx, y, 5.5)} fill="${mk.color}" stroke="${mk.shape === "cross" ? mk.color : "var(--surface)"}" ${mk.shape === "cross" ? "" : 'stroke-width="2"'}
        data-tip="${tipText(`${mk.label} · ${fmt.time(e.t)}`, body)}"/>`;
      s += `<circle cx="${xx}" cy="${y}" r="11" fill="transparent" data-tip="${tipText(`${mk.label} · ${fmt.time(e.t)}`, body)}"/>`;
    }
  });
  s += `</svg>`;
  const used = new Set(m.ev.map(e => e.kind));
  const legend = Object.entries(MARKS).filter(([k, v]) => v && used.has(k))
    .map(([, v]) => `<span><svg width="12" height="12" style="display:inline;width:12px;vertical-align:-1px;margin-right:5px">${markPath(v.shape, 6, 6, 5)} fill="${v.color}" stroke="${v.color}"/></svg>${v.label}</span>`);
  box.innerHTML = `<div class="legend">${m.agents.map(a => `<span><i style="background:${a.color}"></i>${esc(a.name)}</span>`).join("")}${legend.join("")}</div>${s}`;
  bindTip(box);
}

// ---------- Cost per agent (one measure: one color) ----------
function costChart(m) {
  const box = $("#cost");
  const rows = m.agents.map(a => ({ name: a.name, v: a.info.costUSD || 0, tok: (a.info.tokensIn || 0) + (a.info.tokensOut || 0) }))
    .sort((a, b) => b.v - a.v);
  if (!rows.some(r => r.v > 0)) { box.innerHTML = `<p class="empty">Costi non ancora disponibili.</p>`; return; }
  const W = Math.max(300, box.clientWidth), L = 96, R = 64, rowH = 26, H = rows.length * rowH + 4;
  const max = Math.max(...rows.map(r => r.v));
  let s = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Costo per agente">`;
  rows.forEach((r, i) => {
    const y = i * rowH + rowH / 2, w = Math.max(2, (W - L - R) * r.v / max);
    s += `<text x="0" y="${y + 4}" style="fill:var(--text-2)">${esc(r.name.slice(0, 12))}</text>`;
    s += `<rect x="${L}" y="${y - 7}" width="${w}" height="14" rx="4" fill="var(--s1)" data-tip="${tipText(r.name, `\n${fmt.usd(r.v)} · ${fmt.tok(r.tok)} token`)}"/>`;
    s += `<text x="${L + w + 6}" y="${y + 4}" style="fill:var(--text-2)">${fmt.usd(r.v)}</text>`;
  });
  box.innerHTML = s + `</svg>`;
  bindTip(box);
}

// ---------- Pace: actions per minute, all agents (one series) ----------
function pace(m) {
  const box = $("#pace");
  const minutes = Math.max(1, Math.ceil((m.end - m.t0) / 60000));
  const bins = new Array(minutes + 1).fill(0);
  for (const a of m.agents) for (const [k, v] of Object.entries(a.timeline || {})) if (+k <= minutes) bins[+k] += v;
  const total = bins.reduce((a, b) => a + b, 0);
  if (!total) { box.innerHTML = `<p class="empty">Nessuna attività registrata.</p>`; return; }
  // Long workflows: group into 5- or 15-minute buckets so the line stays readable.
  const step = minutes > 240 ? 15 : minutes > 60 ? 5 : 1;
  const pts = [];
  for (let i = 0; i < bins.length; i += step) pts.push(bins.slice(i, i + step).reduce((a, b) => a + b, 0) / step);
  const W = Math.max(300, box.clientWidth), H = 150, L = 28, B = 22, T = 8;
  const max = Math.max(1, ...pts);
  const x = i => L + (W - L - 8) * (pts.length === 1 ? 0.5 : i / (pts.length - 1));
  const y = v => T + (H - T - B) * (1 - v / max);
  const line = pts.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join("");
  let s = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Azioni al minuto">`;
  for (const g of [0, .5, 1]) s += `<line x1="${L}" x2="${W - 8}" y1="${y(max * g)}" y2="${y(max * g)}" stroke="var(--grid)"/><text x="${L - 6}" y="${y(max * g) + 4}" text-anchor="end">${Math.round(max * g)}</text>`;
  s += `<path d="${line}L${x(pts.length - 1)} ${y(0)}L${x(0)} ${y(0)}Z" fill="var(--s1)" opacity=".12"/>`;
  s += `<path d="${line}" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round"/>`;
  s += `<text x="${L}" y="${H - 4}">${fmt.time(m.t0)}</text><text x="${W - 8}" y="${H - 4}" text-anchor="end">${fmt.time(m.end)}</text>`;
  s += `<line id="paceX" y1="${T}" y2="${H - B}" stroke="var(--muted)" visibility="hidden"/><circle id="paceDot" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2" visibility="hidden"/>`;
  s += `<rect x="${L}" y="0" width="${W - L - 8}" height="${H - B}" fill="transparent" id="paceHit"/></svg>`;
  box.innerHTML = s;
  const svg = box.querySelector("svg"), hit = box.querySelector("#paceHit");
  hit.addEventListener("pointermove", e => {
    const p = svg.getBoundingClientRect(), vx = (e.clientX - p.left) * W / p.width;
    const i = Math.round((vx - L) / Math.max(1, (W - L - 8)) * (pts.length - 1));
    const k = Math.max(0, Math.min(pts.length - 1, i));
    for (const id of ["#paceX", "#paceDot"]) box.querySelector(id).setAttribute("visibility", "visible");
    box.querySelector("#paceX").setAttribute("x1", x(k)); box.querySelector("#paceX").setAttribute("x2", x(k));
    box.querySelector("#paceDot").setAttribute("cx", x(k)); box.querySelector("#paceDot").setAttribute("cy", y(pts[k]));
    tip.innerHTML = `<b>${fmt.time(m.t0 + k * step * 60000)}</b>${pts[k].toFixed(1).replace(".", ",")} azioni/min`;
    tip.style.display = "block"; tip.style.left = (e.clientX + 14) + "px"; tip.style.top = (e.clientY + 14) + "px";
  });
  hit.addEventListener("pointerleave", () => { tip.style.display = "none"; for (const id of ["#paceX", "#paceDot"]) box.querySelector(id).setAttribute("visibility", "hidden"); });
}

// ---------- Activity table ----------
function activity(m) {
  const cols = [["command", "Comandi"], ["edit", "Modifiche"], ["write", "File nuovi"], ["read", "Letture"], ["search", "Ricerche"], ["ask", "Domande"]];
  const rows = m.agents.map(a => `<tr><td><span class="who"><i style="background:${a.color}"></i>${esc(a.name)}</span>
      <div style="color:var(--muted);font-size:12px">${esc(a.info.role || a.info.title)}</div></td>
      <td><span class="pill st-${a.info.status === "waitingConfirmation" || a.info.status === "paused" ? "running" : esc(a.info.status)}">${esc(STATUS_IT[a.info.status] || a.info.status)}</span></td>
      ${cols.map(([k]) => `<td class="n">${a.activity?.[k] || "·"}</td>`).join("")}
      <td class="n">${a.files.length || "·"}</td><td class="n">${fmt.dur(a.info.activeSeconds || (a.end - a.start) / 1000)}</td>
      <td class="n">${fmt.tok((a.info.tokensIn || 0) + (a.info.tokensOut || 0))}</td><td class="n">${fmt.usd(a.info.costUSD)}</td></tr>`).join("");
  $("#activity").innerHTML = `<table><thead><tr><th>Agente</th><th>Stato</th>${cols.map(([, l]) => `<th style="text-align:right">${l}</th>`).join("")}
    <th style="text-align:right">File</th><th style="text-align:right">Lavoro</th><th style="text-align:right">Token</th><th style="text-align:right">Costo</th></tr></thead><tbody>${rows}</tbody></table>`;
}

// ---------- Decisions ----------
function decisionsList(m) {
  const items = m.ev.filter(e => e.kind === "autoDecision" || e.kind === "question" || e.kind === "answer" || e.kind === "confirmResult");
  const out = [];
  for (const e of items) {
    if (e.kind === "autoDecision") {
      out.push(`<div class="item"><div class="h"><span class="tag ok">deciso da Elio</span><span>${fmt.time(e.t)}</span></div>
        <div class="b">${esc(e.d.question || "")}</div><div class="r">${icon("arrow", "xs")}<span>${esc(e.text)}</span></div>${e.d.reason ? `<div class="r" style="color:var(--muted)">${esc(e.d.reason)}</div>` : ""}</div>`);
    } else if (e.kind === "question") {
      const decided = m.ev.some(x => x.kind === "autoDecision" && x.d.question === e.text);
      if (decided) continue;
      const ans = m.ev.find(x => x.kind === "answer" && x.t >= e.t && x.workflow === e.workflow);
      out.push(`<div class="item"><div class="h"><span class="tag ask">chiesto a te</span><span>${esc(e.actor)} · ${fmt.time(e.t)}</span></div>
        <div class="b">${esc(e.text)}</div>${ans ? `<div class="r">${icon("reply", "xs")}<span>${esc(ans.text)}</span></div>` : ""}</div>`);
    }
  }
  $("#decisions").innerHTML = out.join("") || `<p class="empty">Nessuna decisione: gli agenti non hanno avuto dubbi.</p>`;
}

// ---------- Taste ----------
function taste(m) {
  const box = $("#taste");
  const v = m.ev.filter(e => e.kind === "tasteViolation");
  const ok = m.ev.filter(e => e.kind === "tasteOk");
  const rules = Object.fromEntries((m.r.taste || []).map(r => [r.id, r]));
  if (!v.length && !ok.length) {
    box.innerHTML = `<p class="empty">${(m.r.taste || []).length ? "Nessuna revisione in questo workflow." : "Non mi hai ancora insegnato i tuoi gusti: dimmi cosa ti piace e cosa no, e lo farò rispettare."}</p>`;
    return;
  }
  const byRule = {};
  for (const e of v) (byRule[e.d.rule] ||= []).push(e);
  const sorted = Object.entries(byRule).sort((a, b) => b[1].length - a[1].length);
  const max = Math.max(1, ...sorted.map(([, l]) => l.length));
  box.innerHTML = `<div class="kpis" style="margin:0 0 14px;grid-template-columns:repeat(3,1fr)">
      ${kpi("Revisioni ok", ok.length, "lavori senza violazioni")}${kpi("Violazioni", v.length, "trovate dal revisore")}
      ${kpi("Correzioni", m.count("tasteCorrection"), "chieste agli agenti")}</div>
    ${sorted.map(([id, list]) => `<div class="item" style="margin-bottom:8px">
      <div class="h"><span class="tag ${list[0].d.severity === "note" ? "" : "fix"}">#${esc(id)} ${esc(rules[id]?.domain || "")}</span>
        <span>${list.length === 1 ? "1 volta" : list.length + " volte"} · ${esc([...new Set(list.map(e => e.d.agent))].join(", "))}</span></div>
      <div class="b">${esc(rules[id]?.rule || "Regola rimossa")}</div>
      <svg viewBox="0 0 100 4" preserveAspectRatio="none" style="height:4px;margin:8px 0 4px"><rect width="${100 * list.length / max}" height="4" rx="2" fill="var(--warn)"/></svg>
      <ul>${list.slice(0, 3).map(e => `<li>${esc(e.d.file ? e.d.file + ": " : "")}${esc(e.text)}</li>`).join("")}</ul></div>`).join("")}`;
}

// ---------- Agent cards ----------
function agentCards(m) {
  $("#agents").innerHTML = m.agents.map(a => `<div class="agent">
    <span class="who"><i style="background:${a.color}"></i>${esc(a.name)}${a.lead ? ' <span class="tag">coordinatore</span>' : ""}</span>
    <div class="role">${esc(a.info.role || a.info.title)}</div>
    <div style="font-size:13px;color:var(--text-2);white-space:pre-wrap;max-height:180px;overflow:auto">${esc(a.info.summary || a.info.lastMessage || "Al lavoro…")}</div>
    ${a.files.length ? `<details><summary>${a.files.length} file toccati</summary>${a.files.map(f => `<code>${esc(f)}</code>`).join("")}</details>` : ""}
    ${a.commands.length ? `<details><summary>${a.commands.length} comandi</summary>${a.commands.map(c => `<code>$ ${esc(c)}</code>`).join("")}</details>` : ""}
  </div>`).join("") || `<p class="empty">Nessun agente.</p>`;
}

// ---------- Feed ----------
function feed(m, group) {
  $("#chips").innerHTML = Object.keys(GROUPS).map(g => `<button class="chip ${g === group ? "on" : ""}" data-g="${g}">${g}</button>`).join("");
  $("#chips").onclick = e => { const g = e.target.dataset?.g; if (g) feed(m, g); };
  const kinds = GROUPS[group];
  const list = m.ev.filter(e => !kinds || kinds.includes(e.kind));
  $("#feed").innerHTML = list.map(e => {
    const a = m.byActor[e.actor];
    const tone = ["agentFailed", "alert"].includes(e.kind) ? "bad" : e.kind === "autoDecision" ? "ok" : e.kind.startsWith("taste") && e.kind !== "tasteOk" ? "fix" : "";
    const to = e.kind === "message" && e.d.to ? ` per ${e.d.to}` : "";
    return `<div class="ev"><div class="t">${fmt.time(e.t)}</div>
      <div class="a"><span class="who">${a ? `<i style="background:${a.color}"></i>` : ""}${esc(e.actor + to)}</span><br><span class="tag ${tone}">${esc(KIND[e.kind] || e.kind)}</span></div>
      <div class="b">${esc(e.kind === "tasteViolation" && e.d.fix ? `${e.text}\nCorrezione: ${e.d.fix}` : e.text)}</div></div>`;
  }).join("") || `<p class="empty">Niente qui.</p>`;
}

addEventListener("resize", () => { clearTimeout(window._rz); window._rz = setTimeout(() => EMBEDDED ? render(EMBEDDED, false) : boot(), 200); });
boot();
</script>
