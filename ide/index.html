<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Elio IDE</title>
<link rel="stylesheet" href="vendor/xterm/xterm.css">
<link rel="stylesheet" href="ide.css">
</head>
<body>
<div id="app">
  <header id="toolbar">
    <button id="projectBtn" class="tb-btn" title="Cambia progetto"><span class="dot"></span><span id="projectName">Scegli un progetto</span><span class="caret">▾</span></button>
    <button id="branchBtn" class="tb-btn" title="Branch"><span class="ico">⎇</span><span id="branchName">—</span></button>
    <span class="spacer"></span>
    <button id="searchBtn" class="tb-btn wide" title="Cerca ovunque (⇧⇧)"><span class="ico">⌕</span>Cerca ovunque <kbd>⇧⇧</kbd></button>
    <span class="spacer"></span>
    <button id="agentsBtn" class="tb-btn" title="Agenti"><span class="ico">◉</span><span id="agentsCount">0 agenti</span></button>
    <button id="commitBtn" class="tb-btn" title="Commit (⌘K)">✓ Commit</button>
    <button id="askBtn" class="tb-btn accent" title="Chiedi a Elio (⌘⌥E)">✦ Elio</button>
  </header>
  <div id="main">
    <aside id="side">
      <nav id="sideTabs">
        <button data-side="project" class="on" title="Progetto (⌘1)">Progetto</button>
        <button data-side="changes" title="Modifiche (⌘0)">Modifiche <span id="changesCount"></span></button>
        <button data-side="agents" title="Agenti">Agenti</button>
      </nav>
      <div id="sideBody">
        <div id="tree" class="side-pane on"></div>
        <div id="changes" class="side-pane"></div>
        <div id="agentsList" class="side-pane"></div>
      </div>
    </aside>
    <div id="vsplit" class="splitter v"></div>
    <section id="center">
      <div id="tabs"></div>
      <div id="crumbs"></div>
      <div id="banner" class="hidden"></div>
      <div id="editorWrap">
        <div id="editor"></div>
        <div id="diffEditor" class="hidden"></div>
        <div id="welcome">
          <div class="logo">E.L.I.O. <span>IDE</span></div>
          <div class="hints">
            <div><span>Cerca ovunque</span><kbd>⇧⇧</kbd></div>
            <div><span>Vai a file</span><kbd>⌘⇧O</kbd></div>
            <div><span>File recenti</span><kbd>⌘E</kbd></div>
            <div><span>Cerca nel progetto</span><kbd>⌘⇧F</kbd></div>
            <div><span>Terminale</span><kbd>⌥F12</kbd></div>
            <div><span>Commit</span><kbd>⌘K</kbd></div>
            <div><span>Azioni</span><kbd>⌘⇧A</kbd></div>
            <div><span>Chiedi a Elio</span><kbd>⌘⌥E</kbd></div>
          </div>
        </div>
      </div>
      <div id="hsplit" class="splitter h"></div>
      <div id="panel">
        <nav id="panelTabs"></nav>
        <div id="panelBody"></div>
      </div>
    </section>
  </div>
  <footer id="status">
    <span id="stBranch"></span>
    <span id="stAgents" class="click"></span>
    <span class="spacer"></span>
    <span id="stMsg"></span>
    <span id="stPos"></span>
    <span id="stLang"></span>
    <span id="stIndent"></span>
    <span>UTF-8</span>
    <span id="stSave"></span>
  </footer>
</div>

<div id="palette" class="overlay hidden">
  <div class="pal">
    <div class="pal-head"><span id="palTitle">Cerca ovunque</span><span id="palHint"></span></div>
    <input id="palInput" autocomplete="off" spellcheck="false">
    <div id="palList"></div>
  </div>
</div>

<div id="dialog" class="overlay hidden"><div class="dlg" id="dlgBody"></div></div>
<div id="ctx" class="hidden"></div>
<div id="toast" class="hidden"></div>

<script src="vendor/xterm/xterm.js"></script>
<script src="vendor/xterm/addon-fit.js"></script>
<script src="vendor/xterm/addon-search.js"></script>
<script src="vendor/xterm/addon-web-links.js"></script>
<script src="vendor/monaco/vs/loader.js"></script>
<script src="ide.js"></script>
</body>
</html>
